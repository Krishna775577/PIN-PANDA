<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Boards • Pin Panda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="header">
    <div class="header-left flex items-center gap-16">
      <a href="index.html" class="logo" aria-label="Pin Panda">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.627 0-12 5.372-12 12 0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345l-.333 1.36c-.053.22-.174.267-.401.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146 1.124.347 2.317.535 3.554.535 6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/></svg>
        Pin Panda
      </a>
    </div>
    <nav class="header-right flex items-center gap-4" id="authSection"></nav>
  </header>

  <main class="main">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px;">
      <h1 style="font-size:28px;font-weight:700;">Your boards</h1>
      <button class="btn-create" id="createBoardBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Create board</button>
    </div>

    <div class="board-grid" id="boardsGrid"></div>
    <div id="emptyState" class="text-center py-16" style="display:none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--muted);margin-bottom:16px;"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
      <h3 style="font-size:18px;font-weight:600;margin-bottom:8px;">No boards yet</h3>
      <p style="color:var(--muted);margin-bottom:16px;">Save ideas by creating your first board</p>
      <button class="btn-create" id="firstBoardBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Create board</button>
    </div>
  </main>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script type="module">
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { auth } from './assets/js/firebase-config.js';

    onAuthStateChanged(auth, (user) => {
      if (user && !Auth.isLoggedIn()) {
        user.getIdToken().then(idToken => {
          Auth.setSession({
            id: user.uid,
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            username: (user.displayName || user.email.split('@')[0]).toLowerCase().replace(/\s+/g, ''),
            avatar: user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`,
            bio: '', followers: 0, following: [], pins: 0, boards: 0,
            createdAt: new Date().toISOString(),
            settings: { emailNotifications: true, pushNotifications: true, privateProfile: false },
            firebaseToken: idToken
          }, true);
        });
      }
    });
  </script>
  <script>
    App.boardsInit = async function() {
      try {
        const boards = await API.getBoards();
        const grid = document.getElementById('boardsGrid');
        const empty = document.getElementById('emptyState');

        if (boards.length === 0) {
          empty.style.display = 'block';
          grid.style.display = 'none';
        } else {
          empty.style.display = 'none';
          grid.style.display = '';
          this.renderBoards(boards, grid);
        }

        document.getElementById('createBoardBtn').addEventListener('click', () => this.openCreateBoardModal());
        document.getElementById('firstBoardBtn').addEventListener('click', () => this.openCreateBoardModal());
      } catch (err) {
        this.showToast('Failed to load boards', 'error');
      }
    };

    App.renderBoards = function(boards, container) {
      container.innerHTML = boards.map(board => `
        <a href="board.html?id=${board.id}" class="board-card">
          <div class="board-cover">
            ${board.cover ? `<img src="${board.cover}" alt="${board.title}" loading="lazy">` : `<div style="width:100%;height:100%;background:var(--border);"></div>`}
            ${board.secret ? `<span style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;">🔒 Secret</span>` : ''}
          </div>
          <div class="board-info">
            <h3 class="board-title">${board.title}</h3>
            <div class="board-count">${board.pins} pins</div>
          </div>
        </a>
      `).join('');
    };
  </script>
</body>
</html>
