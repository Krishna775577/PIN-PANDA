<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search • Pin Panda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="header">
    <div class="header-left flex items-center gap-16">
      <a href="index.html" class="logo" aria-label="Pin Panda">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.627 0-12 5.372-12 12 0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345l-.333 1.36c-.053.22-.174.267-.401.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146 1.124.347 2.317.535 3.554.535 6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/></svg>
        Pin Panda
      </a>
      <div class="search-wrap flex-1" style="max-width:640px;position:relative;">
        <input type="search" class="search-input" id="searchInput" placeholder="Search ideas" aria-label="Search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
    </div>
    <nav class="header-right flex items-center gap-4" id="authSection"></nav>
  </header>

  <main class="main">
    <div class="tabs" id="searchTabs" role="tablist" aria-label="Search filters">
      <button class="tab active" role="tab" aria-selected="true" data-type="pins">Pins</button>
      <button class="tab" role="tab" aria-selected="false" data-type="boards">Boards</button>
      <button class="tab" role="tab" aria-selected="false" data-type="people">People</button>
    </div>

    <div id="searchResults">
      <!-- Pins grid -->
      <div class="grid" id="pinsGrid" style="display:none;"></div>
      <div id="pinsLoading" class="flex justify-center py-16" style="display:none;"><div class="btn loading" style="width:40px;height:40px;border-color:var(--red) transparent var(--red) transparent;"></div></div>

      <!-- Boards grid -->
      <div class="board-grid" id="boardsGrid" style="display:none;"></div>

      <!-- People list -->
      <div id="peopleList" style="display:none;"></div>

      <div id="emptyState" class="text-center py-16" style="display:none;">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--muted);margin-bottom:16px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <h3 style="font-size:18px;font-weight:600;margin-bottom:8px;">No results found</h3>
        <p style="color:var(--muted);">Try a different search term</p>
      </div>
    </div>
  </main>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script type="module">
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { auth } from './assets/js/firebase-config.js';

    onAuthStateChanged(auth, (user) => {
      if (user && !Auth.isLoggedIn()) {
        user.getIdToken().then(idToken => {
          Auth.setSession({
            id: user.uid,
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            username: (user.displayName || user.email.split('@')[0]).toLowerCase().replace(/\s+/g, ''),
            avatar: user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`,
            bio: '', followers: 0, following: [], pins: 0, boards: 0,
            createdAt: new Date().toISOString(),
            settings: { emailNotifications: true, pushNotifications: true, privateProfile: false },
            firebaseToken: idToken
          }, true);
        });
      }
    });
  </script>
  <script>
    App.searchInit = async function() {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q') || '';
      this.state.searchQuery = query;
      this.state.searchType = 'pins';

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = query;
        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' && e.target.value.trim()) {
            window.location.href = `search.html?q=${encodeURIComponent(e.target.value.trim())}`;
          }
        });
      }

      // Tab switching
      document.querySelectorAll('#searchTabs .tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#searchTabs .tab').forEach(t => {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');
          this.state.searchType = tab.dataset.type;
          this.renderSearchResults();
        });
      });

      if (query) {
        await this.renderSearchResults();
      } else {
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('emptyState').querySelector('h3').textContent = 'Search for ideas';
        document.getElementById('emptyState').querySelector('p').textContent = 'Enter a keyword to discover pins, boards, and people';
      }
    };

    App.renderSearchResults = async function() {
      const { searchQuery, searchType } = this.state;
      if (!searchQuery) return;

      // Hide all
      document.getElementById('pinsGrid').style.display = 'none';
      document.getElementById('boardsGrid').style.display = 'none';
      document.getElementById('peopleList').style.display = 'none';
      document.getElementById('pinsLoading').style.display = 'none';
      document.getElementById('emptyState').style.display = 'none';

      try {
        if (searchType === 'pins') {
          document.getElementById('pinsGrid').style.display = '';
          document.getElementById('pinsLoading').style.display = 'flex';
          const pins = await API.searchPins(searchQuery, 30);
          document.getElementById('pinsLoading').style.display = 'none';
          if (pins.length === 0) {
            document.getElementById('emptyState').style.display = 'block';
          } else {
            const savedPins = JSON.parse(localStorage.getItem('saved_pins') || '[]');
            pins.forEach(p => p.saved = savedPins.includes(p.id));
            this.renderPins(pins, document.getElementById('pinsGrid'));
          }
        } else if (searchType === 'boards') {
          document.getElementById('boardsGrid').style.display = '';
          const boards = await API.searchBoards(searchQuery, 20);
          if (boards.length === 0) {
            document.getElementById('emptyState').style.display = 'block';
          } else {
            this.renderBoards(boards, document.getElementById('boardsGrid'));
          }
        } else if (searchType === 'people') {
          document.getElementById('peopleList').style.display = '';
          const users = await API.searchUsers(searchQuery, 20);
          if (users.length === 0) {
            document.getElementById('emptyState').style.display = 'block';
          } else {
            this.renderPeople(users, document.getElementById('peopleList'));
          }
        }
      } catch (err) {
        this.showToast('Search failed', 'error');
      }
    };

    App.renderBoards = function(boards, container) {
      container.innerHTML = boards.map(board => `
        <a href="board.html?id=${board.id}" class="board-card">
          <div class="board-cover">
            ${board.cover ? `<img src="${board.cover}" alt="${board.title}" loading="lazy">` : `<div style="width:100%;height:100%;background:var(--border);"></div>`}
          </div>
          <div class="board-info">
            <h3 class="board-title">${board.title}</h3>
            <div class="board-count">${board.pins} pins</div>
          </div>
        </a>
      `).join('');
    };

    App.renderPeople = function(users, container) {
      const currentUser = Auth.getSession();
      container.innerHTML = users.map(user => `
        <a href="profile.html?user=${user.username}" class="notification" style="border-bottom:1px solid var(--border);text-decoration:none;color:inherit;">
          <div class="avatar" style="width:48px;height:48px;">
            <img src="${user.avatar}" alt="${user.name}" loading="lazy">
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;">${user.name}</div>
            <div style="font-size:13px;color:var(--muted);">@${user.username}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">${user.pins} pins · ${user.followers.toLocaleString()} followers</div>
          </div>
          <button class="btn-follow ${currentUser?.following?.includes(user.id) ? 'following' : ''}" data-user-id="${user.id}" style="padding:6px 16px;font-size:13px;">
            ${currentUser?.following?.includes(user.id) ? 'Following' : 'Follow'}
          </button>
        </a>
      `).join('');
    };
  </script>
</body>
</html>
