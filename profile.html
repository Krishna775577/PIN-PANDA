<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile • Pin Panda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="header">
    <div class="header-left flex items-center gap-16">
      <a href="index.html" class="logo" aria-label="Pin Panda">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.627 0-12 5.372-12 12 0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146 1.124.347 2.317.535 3.554.535 6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/></svg>
        Pin Panda
      </a>
    </div>
    <nav class="header-right flex items-center gap-4" id="authSection"></nav>
  </header>

  <main class="main">
    <div id="profileContainer" style="display:none;">
      <!-- Rendered by JS -->
    </div>
    <div id="profileLoading" class="flex justify-center py-16"><div class="btn loading" style="width:40px;height:40px;border-color:var(--red) transparent var(--red) transparent;"></div></div>
    <div id="profileError" class="text-center py-16" style="display:none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--muted);margin-bottom:16px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <h3 style="font-size:18px;font-weight:600;margin-bottom:8px;">Profile not found</h3>
      <p style="color:var(--muted);"><a href="index.html" style="color:var(--red);">Back to home</a></p>
    </div>
  </main>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script type="module">
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { auth } from './assets/js/firebase-config.js';

    onAuthStateChanged(auth, (user) => {
      if (user && !Auth.isLoggedIn()) {
        user.getIdToken().then(idToken => {
          Auth.setSession({
            id: user.uid,
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            username: (user.displayName || user.email.split('@')[0]).toLowerCase().replace(/\s+/g, ''),
            avatar: user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`,
            bio: '', followers: 0, following: [], pins: 0, boards: 0,
            createdAt: new Date().toISOString(),
            settings: { emailNotifications: true, pushNotifications: true, privateProfile: false },
            firebaseToken: idToken
          }, true);
        });
      }
    });
  </script>
  <script>
    App.profileInit = async function() {
      const params = new URLSearchParams(window.location.search);
      const username = params.get('user');
      const isOwn = !username && Auth.isLoggedIn();

      try {
        let user;
        if (username) {
          user = await API.getUser(username);
        } else if (isOwn) {
          user = await API.getCurrentUserProfile();
        } else {
          throw new Error('Not found');
        }

        this.state.profileUser = user;
        this.renderProfile(user, isOwn);
        await this.loadProfilePins(user.id);
      } catch (err) {
        document.getElementById('profileLoading').style.display = 'none';
        document.getElementById('profileError').style.display = 'block';
      }
    };

    App.renderProfile = function(user, isOwn) {
      document.getElementById('profileLoading').style.display = 'none';
      document.getElementById('profileContainer').style.display = '';

      const currentUser = Auth.getSession();
      const following = currentUser?.following?.includes(user.id) || false;

      document.getElementById('profileContainer').innerHTML = `
        <div class="profile-header">
          <div class="profile-info">
            <a href="#" class="avatar avatar-xl" style="width:120px;height:120px;">
              ${user.avatar ? `<img src="${user.avatar}" alt="${user.name}" loading="lazy">` : `<div class="avatar-text" style="font-size:48px;">${user.name.charAt(0)}</div>`}
            </a>
            <div>
              <h1 class="profile-name">${user.name}</h1>
              <div style="font-size:14px;color:var(--muted);">@${user.username}</div>
              ${user.bio ? `<p class="profile-bio" style="margin-top:8px;">${user.bio}</p>` : ''}
            </div>
          </div>
          <div class="profile-stats">
            <div class="profile-stat">${user.pins.toLocaleString()}<span style="font-weight:400;color:var(--muted);font-size:13px;margin-left:4px;">pins</span></div>
            <div class="profile-stat">${user.boards.toLocaleString()}<span style="font-weight:400;color:var(--muted);font-size:13px;margin-left:4px;">boards</span></div>
            <div class="profile-stat">${user.followers.toLocaleString()}<span style="font-weight:400;color:var(--muted);font-size:13px;margin-left:4px;">followers</span></div>
            <div class="profile-stat">${(user.following?.length || 0).toLocaleString()}<span style="font-weight:400;color:var(--muted);font-size:13px;margin-left:4px;">following</span></div>
          </div>
          ${!isOwn ? `
            <div class="profile-actions">
              <button class="btn-follow ${following ? 'following' : ''}" data-user-id="${user.id}" id="followBtn">
                ${following ? 'Following' : 'Follow'}
              </button>
              <button class="btn-secondary" id="moreBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
            </div>
          ` : `
            <div class="profile-actions">
              <a href="settings.html" class="btn-secondary">Settings</a>
              <a href="create.html" class="btn-create"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Create</a>
            </div>
          `}
        </div>

        <div class="tabs" id="profileTabs" role="tablist">
          <button class="tab active" role="tab" aria-selected="true" data-tab="pins">Pins</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="boards">Boards</button>
        </div>

        <div id="profileContent">
          <div class="grid" id="profilePinsGrid" style="display:none;"></div>
          <div class="board-grid" id="profileBoardsGrid" style="display:none;"></div>
        </div>
      `;

      // Tab switching
      document.querySelectorAll('#profileTabs .tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#profileTabs .tab').forEach(t => {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');
          document.getElementById('profilePinsGrid').style.display = tab.dataset.tab === 'pins' ? '' : 'none';
          document.getElementById('profileBoardsGrid').style.display = tab.dataset.tab === 'boards' ? '' : 'none';
        });
      });

      // Follow button
      const followBtn = document.getElementById('followBtn');
      if (followBtn) {
        followBtn.addEventListener('click', () => this.toggleFollow(user.id, followBtn));
      }
    };

    App.loadProfilePins = async function(userId) {
      try {
        const pins = await API.getPins(50, 0);
        const userPins = pins.filter(p => p.userId === userId);
        const savedPins = JSON.parse(localStorage.getItem('saved_pins') || '[]');
        userPins.forEach(p => p.saved = savedPins.includes(p.id));
        this.renderPins(userPins, document.getElementById('profilePinsGrid'));
        document.getElementById('profilePinsGrid').style.display = '';

        const boards = await API.getBoards(userId);
        this.renderBoards(boards, document.getElementById('profileBoardsGrid'));
        document.getElementById('profileBoardsGrid').style.display = 'none';
      } catch (err) {
        console.error('Failed to load profile content', err);
      }
    };

    App.toggleFollow = async function(userId, btn) {
      if (!Auth.isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }
      const following = btn.classList.contains('following');
      try {
        if (following) {
          await API.unfollowUser(userId);
          btn.classList.remove('following');
          btn.textContent = 'Follow';
        } else {
          await API.followUser(userId);
          btn.classList.add('following');
          btn.textContent = 'Following';
        }
        this.showToast(following ? 'Unfollowed' : 'Following!');
      } catch (err) {
        this.showToast('Failed to update', 'error');
      }
    };
  </script>
</body>
</html>
