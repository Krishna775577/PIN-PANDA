<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board • Pin Panda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="header">
    <div class="header-left flex items-center gap-16">
      <a href="index.html" class="logo" aria-label="Pin Panda">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.627 0-12 5.372-12 12 0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345l-.333 1.36c-.053.22-.174.267-.401.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146 1.124.347 2.317.535 3.554.535 6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/></svg>
        Pin Panda
      </a>
    </div>
    <nav class="header-right flex items-center gap-4" id="authSection"></nav>
  </header>

  <main class="main">
    <div id="boardContainer" style="display:none;">
      <!-- Rendered by JS -->
    </div>
    <div id="boardLoading" class="flex justify-center py-16"><div class="btn loading" style="width:40px;height:40px;border-color:var(--red) transparent var(--red) transparent;"></div></div>
    <div id="boardError" class="text-center py-16" style="display:none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--muted);margin-bottom:16px;"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <h3 style="font-size:18px;font-weight:600;margin-bottom:8px;">Board not found</h3>
      <p style="color:var(--muted);"><a href="boards.html" style="color:var(--red);">Back to boards</a></p>
    </div>
  </main>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script type="module">
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { auth } from './assets/js/firebase-config.js';

    // Wait for Firebase auth, then init app
    onAuthStateChanged(auth, (user) => {
      if (user && !Auth.isLoggedIn()) {
        // Sync Firebase user to local session
        user.getIdToken().then(idToken => {
          Auth.setSession({
            id: user.uid,
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            username: (user.displayName || user.email.split('@')[0]).toLowerCase().replace(/\s+/g, ''),
            avatar: user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`,
            bio: '', followers: 0, following: [], pins: 0, boards: 0,
            createdAt: new Date().toISOString(),
            settings: { emailNotifications: true, pushNotifications: true, privateProfile: false },
            firebaseToken: idToken
          }, true);
        });
      }
      // App will be initialized by the inline script below
    });
  </script>
  <script>
    App.boardInit = async function() {
      const params = new URLSearchParams(window.location.search);
      const boardId = params.get('id');
      if (!boardId) {
        document.getElementById('boardLoading').style.display = 'none';
        document.getElementById('boardError').style.display = 'block';
        return;
      }

      try {
        const board = await API.getBoard(boardId);
        const currentUser = Auth.getSession();
        const isOwner = currentUser?.id === board.user?.id;

        document.getElementById('boardLoading').style.display = 'none';
        document.getElementById('boardContainer').style.display = '';

        const gradient = board.cover || `linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%)`;
        document.getElementById('boardContainer').innerHTML = `
          <div style="margin-bottom:24px;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;">
              <div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                  <span style="background:var(--border);padding:4px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:500;">Board</span>
                  ${board.secret ? '<span style="background:var(--red-light);color:var(--red);padding:4px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:500;">🔒 Secret</span>' : ''}
                </div>
                <h1 style="font-size:32px;font-weight:700;line-height:1.2;">${board.title}</h1>
                ${board.description ? `<p style="font-size:15px;color:var(--muted);margin-top:8px;max-width:600px;">${board.description}</p>` : ''}
              </div>
              <div style="display:flex;gap:12px;flex-shrink:0;">
                ${!isOwner ? `<button class="btn-follow" data-board-id="${board.id}" style="padding:10px 20px;font-size:14px;">Save</button>` : '<span style="padding:10px 20px;font-size:14px;color:var(--muted);">Your board</span>'}
                <button class="btn-secondary" id="boardMoreBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
              </div>
            </div>

            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
              <a href="profile.html?user=${board.user.username}" class="avatar avatar-lg">
                ${board.user.avatar ? `<img src="${board.user.avatar}" alt="${board.user.name}" loading="lazy">` : `<div class="avatar-text" style="font-size:28px;">${board.user.name.charAt(0)}</div>`}
              </a>
              <div>
                <a href="profile.html?user=${board.user.username}" style="font-weight:600;font-size:15px;">${board.user.name}</a>
                <div style="font-size:13px;color:var(--muted);">${board.pins} pins · ${App.formatDate(board.createdAt)}</div>
              </div>
              ${!isOwner ? `<button class="btn-follow" data-user-id="${board.user.id}" style="padding:6px 16px;font-size:13px;">Follow</button>` : ''}
            </div>
          </div>

          <div class="grid" id="boardPinsGrid"></div>
          <div id="boardEmpty" class="text-center py-16" style="display:none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--muted);margin-bottom:16px;"><path d="M12 3v18M3 12h18"/></svg>
            <h3 style="font-size:18px;font-weight:600;margin-bottom:8px;">No pins yet</h3>
            <p style="color:var(--muted);">Save ideas to this board</p>
          </div>
        `;

        // Load pins
        const savedPins = JSON.parse(localStorage.getItem('saved_pins') || '[]');
        board.pins.forEach(p => p.saved = savedPins.includes(p.id));
        if (board.pins.length === 0) {
          document.getElementById('boardEmpty').style.display = 'block';
        } else {
          this.renderPins(board.pins, document.getElementById('boardPinsGrid'));
        }

        // Bind save board button
        const saveBoardBtn = document.querySelector('[data-board-id]');
        if (saveBoardBtn) {
          saveBoardBtn.addEventListener('click', () => {
            this.showToast('Board saved to your profile!');
          });
        }
      } catch (err) {
        document.getElementById('boardLoading').style.display = 'none';
        document.getElementById('boardError').style.display = 'block';
      }
    };
  </script>
</body>
</html>
